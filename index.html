        html {

        * {

            padding: 0;
            box-sizing: border-box;

            transition: background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
            background-color: var(--bg-body);
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
            font-size: 0;
            line-height: 0;
        }

        
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: blur(18px) brightness(0.85) saturate(1.1);
            z-index: -1;
            transform: scale(1.08);
        }

        
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                var(--bg-overlay-start) 0%,
                var(--bg-overlay-mid) 40%,
                var(--bg-overlay-end) 100%);
            z-index: -1;
        }

        .header {
            background-color: var(--header-bg);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px var(--header-shadow);
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--icon-border);
            object-fit: cover;
            background-color: var(--icon-bg);
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 0 0 rgba(255, 255, 255, 0);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;
        }

        .icon:hover {
            transform: scale(1.08) rotate(-4deg);
            border-color: var(--icon-hover-border);
            box-shadow: 0 0 20px var(--icon-hover-shadow), 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .icon:active {
            transform: scale(0.94) rotate(0deg);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.45), 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .title {
            color: var(--title-color);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        
        .theme-toggle-btn {
            width: 32px;
            height: 32px;
            font-size: 16px;
            background: var(--theme-toggle-bg);
            color: var(--theme-toggle-text);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
            line-height: 1;
        }

        .theme-toggle-btn:hover {
            background: var(--theme-toggle-hover-bg);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .theme-toggle-btn:active {
            transform: scale(0.92);
        }

        
        .accent-label {
            color: rgba(255,255,255,0.9);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            text-shadow: 0 0 2px rgba(0,0,0,0.2);
        }
        .accent-picker-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .accent-picker-btn:hover {
            border-color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.12);
            transform: scale(1.1);
        }

        .accent-picker-btn:active {
            transform: scale(0.92);
        }

        .accent-color-dot {
            display: block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e53935;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        
        .accent-picker-modal {
            background: var(--modal-box-bg);
            border: 2px solid var(--header-bg);
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 12px 40px var(--modal-box-shadow);
            text-align: center;
        }

        .accent-picker-title {
            color: var(--header-bg);
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 22px 0;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accent-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .accent-option {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            padding: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            flex-shrink: 0;
            position: relative;
        }

        .accent-option:hover {
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        .accent-option.active {
            border-color: var(--header-bg);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.6), 0 0 14px rgba(0,0,0,0.25);
            transform: scale(1.12);
        }

        .accent-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .accent-picker-footer {
            margin-top: 8px;
            text-align: center;
        }

        .accent-picker-hint {
            font-size: 13px;
            color: #888;
            margin: 0 0 10px 0;
            user-select: none;
        }

        .accent-picker-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .accent-confirm-btn,
        .accent-cancel-btn {
            flex: 0 0 auto;
            width: 160px;
            padding-left: 12px;
            padding-right: 12px;
            text-align: center;
        }

        .accent-cancel-btn {
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%);
            color: #333;
            border-color: #9e9e9e;
            box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        }

        .accent-cancel-btn:hover {
            background: linear-gradient(135deg, #eeeeee 0%, #cfcfcf 100%);
            border-color: #757575;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }

        
        .lang-dropdown {
            position: relative;
            flex-shrink: 0;
            user-select: none;
        }

        .lang-dropdown-selected {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            color: var(--lang-select-text);
            background: var(--lang-select-bg);
            border: 2px solid var(--lang-select-border);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--lang-select-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .lang-dropdown-selected:hover {
            background: var(--lang-select-hover-bg);
            border-color: var(--lang-select-hover-border);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--lang-select-shadow);
        }

        .lang-dropdown-arrow {
            font-size: 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-dropdown.open .lang-dropdown-arrow {
            transform: rotate(180deg);
        }

        .lang-dropdown-options {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--lang-select-bg);
            border: 2px solid var(--lang-select-border);
            border-radius: 8px;
            box-shadow: 0 6px 18px var(--lang-select-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow: hidden;
        }

        .lang-dropdown.open .lang-dropdown-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-dropdown-option {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: var(--lang-select-text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-dropdown-option:hover {
            background: var(--lang-option-hover-bg);
        }

        .lang-dropdown-option.active {
            background: var(--lang-option-active-bg);
            color: var(--lang-option-active-text);
        }

        
        .info-btn {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            color: var(--info-btn-text);
            background: linear-gradient(135deg, var(--info-btn-bg-start) 0%, var(--info-btn-bg-end) 100%);
            border: 2px solid var(--info-btn-border);
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px var(--info-btn-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .info-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px var(--info-btn-hover-shadow);
            background: linear-gradient(135deg, var(--info-btn-hover-bg-start) 0%, var(--info-btn-hover-bg-end) 100%);
            border-color: var(--info-btn-hover-border);
        }

        .info-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .content {
            max-width: 820px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        
        .toggle-btn {
            position: relative;
            min-width: 200px;
            max-width: 90%;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: bold;
            color: var(--toggle-btn-text);
            background: linear-gradient(135deg, var(--toggle-btn-bg-start) 0%, var(--toggle-btn-bg-end) 100%);
            border: 2px solid var(--toggle-btn-border);
            border-radius: 24px;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px var(--toggle-btn-shadow);
            transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .toggle-btn .toggle-text {
            display: inline-block;
            transition: opacity 0.2s ease;
        }

        .toggle-btn:hover {
            background: linear-gradient(135deg, var(--toggle-btn-hover-bg-start) 0%, var(--toggle-btn-hover-bg-end) 100%);
            border-color: var(--toggle-btn-hover-border);
            color: var(--toggle-btn-hover-text);
            box-shadow: 0 4px 14px var(--toggle-btn-hover-shadow);
            transform: translateY(-2px);
        }

        .toggle-btn:hover .toggle-text {
            opacity: 0;
        }

        .toggle-btn::after {
            content: attr(data-hover-text);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15px;
            font-weight: bold;
            color: var(--toggle-btn-hover-text);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        .toggle-btn:hover::after {
            opacity: 1;
            animation: fadeInHover 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInHover {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .toggle-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .toggle-btn.switching {

            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.5);

            15% {
                opacity: 0.55;

            }
            40% {
                opacity: 0.4;
                transform: translate(-50%, -50%) rotate(-12deg) scale(1.1);

                transform: translate(-50%, -60%) rotate(-15deg) scale(1.3);

            z-index: 9998;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: var(--color);
            opacity: 0;
            animation: fragmentBurst 0.55s ease-out forwards;
        }

        @keyframes fragmentBurst {
            0% {
                opacity: 0.7;
                transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(0.2);
            }
        }

        
        .accent-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        .accent-transition.active {
            animation: accentRippleFade 0.5s ease-in forwards;
        }

        .accent-transition::before {
            content: '';
            position: absolute;
            top: var(--ripple-y, 50%);
            left: var(--ripple-x, 50%);
            width: 200vmax;
            height: 200vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 60%);
            border: 6px solid #fff;
            box-shadow: 0 0 24px rgba(255,255,255,0.3), inset 0 0 24px rgba(255,255,255,0.12);
            transform: translate(-50%, -50%) scale(0);
        }

        .accent-transition.active::before {
            animation: accentRippleExpand 0.5s cubic-bezier(0.42, 0, 1, 1) forwards;
        }

        @keyframes accentRippleFade {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes accentRippleExpand {
            0%   { transform: translate(-50%, -50%) scale(0.0001); opacity: 0; }
            3%   { transform: translate(-50%, -50%) scale(0.003); opacity: 1; }
            10%  { transform: translate(-50%, -50%) scale(0.008); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        
        @media (max-width: 600px) {
            .header {
                padding: 10px 10px;
                gap: 6px;
            }
            .header-title-group {
                gap: 6px;
            }
            .header-controls {
                gap: 4px;
                width: 100%;
                justify-content: flex-end;
            }
            .title {
                font-size: 16px;
            }
            .icon {
                width: 36px;
                height: 36px;
            }
            .info-btn {
                padding: 5px 10px;
                font-size: 11px;
            }
            .theme-toggle-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .accent-picker-btn {
                width: 28px;
                height: 28px;
            }
            .accent-color-dot {
                width: 14px;
                height: 14px;
            }
            .accent-label {
                font-size: 9px;
            }
            .lang-dropdown-selected {
                padding: 4px 7px;
                font-size: 10px;
            }
            .lang-dropdown-option {
                padding: 6px 8px;
                font-size: 10px;
            }
        }
